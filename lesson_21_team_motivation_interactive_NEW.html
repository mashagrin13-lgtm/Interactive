<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как поддержать разные команды — практика (новая версия)</title>
<style>
:root{--ink:#19283a;--sub:#526578;--navy:#102842;--sea:#167c7c;--soft:#eef5f7;--edge:#dbe5ec;--green:#17795d;--red:#b94443;--paper:#fff;--bg:#edf2f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);line-height:1.45}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,.option:focus-visible,.drop:focus-visible{outline:3px solid #71c9c8;outline-offset:3px}
.shell{max-width:1100px;margin:20px auto;background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 14px 45px #21344912;border:1px solid var(--edge)}.top{background:var(--navy);color:#fff;padding:24px 32px 22px}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:750}h1{margin:7px 0 7px;font-size:clamp(22px,3vw,31px);font-weight:790;line-height:1.18} .top p{margin:0;max-width:790px;color:#d5e5ed;font-size:14px}.ghost{border:1px solid #a9c6d458;background:transparent;color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;white-space:nowrap}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:22px}.prog{height:5px;border-radius:8px;background:#ffffff2b}.prog.active{background:#52cdc0}.body{padding:28px 32px 24px;min-height:510px}.stepmark{font-size:12px;color:var(--sea);font-weight:750;letter-spacing:.04em}.body h2{font-size:22px;line-height:1.24;margin:7px 0 12px}.desc{max-width:900px;color:var(--sub);margin:0 0 23px;font-size:15px;line-height:1.55}.group{display:grid;gap:11px}.option{display:block;width:100%;border:1.5px solid var(--edge);border-radius:12px;background:#fff;text-align:left;padding:15px 16px;transition:border-color .15s,background .15s;color:var(--ink);font-size:14px;line-height:1.48}.option:hover{border-color:#67b8b4}.option.selected{background:#edf9f7;border-color:var(--sea)}.option.ok{background:#edf8f1;border-color:var(--green)}.option.bad{background:#fff0ef;border-color:var(--red)}.option b{font-weight:760}.hint{background:var(--soft);border-left:3px solid var(--sea);padding:13px 16px;border-radius:8px;color:#355064;font-size:14px;margin:15px 0}.feedback{padding:13px 16px;border-radius:10px;margin-top:18px;font-size:14px}.feedback.ok{background:#e9f7ef;color:#225c45}.feedback.bad{background:#fff0ee;color:#8b3735}.feedback.neutral{background:#eef6f9;color:#3b536b}
.draggrid{display:grid;grid-template-columns:minmax(250px,1fr) minmax(330px,1.1fr);gap:18px}.pool,.targets{background:#f6f9fb;border-radius:15px;padding:16px;border:1px solid var(--edge)}.pool h3,.targets h3{font-size:14px;color:#4a6678;margin:0 0 12px}.chips{display:flex;flex-direction:column;gap:10px;min-height:80px}.chip{padding:13px 14px;border:1px solid #c2d6df;background:#fff;border-radius:11px;box-shadow:0 2px 3px #1b3d4b09;cursor:grab;user-select:none;font-size:13px;touch-action:none}.chip:active{cursor:grabbing}.chip strong{display:block;margin-bottom:4px;color:#123751}.drop{min-height:72px;border:1.5px dashed #97b8c5;border-radius:11px;background:#fff;padding:10px;margin-bottom:11px;display:flex;flex-direction:column;gap:7px;transition:background .12s}.drop:last-child{margin-bottom:0}.drop.hover{border-color:#0b817f;background:#e5f8f3}.drop label{display:block;font-size:13px;font-weight:750;color:#335b71}.drop .chip{margin-top:2px}.chip.ok{border-color:var(--green);background:#eef9f2}.chip.bad{border-color:var(--red);background:#fff1ee}.bankdrop{border:1.5px dashed #9fb8c4;border-radius:10px;padding:9px;margin-top:14px;min-height:50px;text-align:center;font-size:12px;color:#637b87}.bankdrop.hover{background:#e5f8f3}.foot{border-top:1px solid var(--edge);padding:17px 32px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fbfcfd}.controls{display:flex;gap:9px;flex-wrap:wrap}.btn{border-radius:11px;padding:11px 18px;font-size:14px;font-weight:720;border:1px solid #b9cbd5;color:var(--ink);background:#fff}.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}.btn.primary:hover{background:#0a6768}.btn.light:hover{background:#eff7f8}.small{font-size:12px;color:#7b8a96}.summary{display:grid;grid-template-columns:1fr 1fr;gap:13px}.summcard{border:1px solid var(--edge);border-radius:13px;padding:18px;background:#f7fafb}.summcard h3{margin:0 0 7px;font-size:14px}.summcard p{margin:0;color:#4b6070;font-size:14px}.pointerclone{position:fixed;z-index:9999;pointer-events:none;max-width:290px;opacity:.92;transform:translate(-50%,-50%);box-shadow:0 10px 24px #16334a3c}
@media(max-width:760px){.shell{border-radius:0;margin:0;min-height:100vh}.top,.body{padding:20px 18px}.foot{padding:14px 18px;align-items:flex-start;flex-wrap:wrap}.toprow{flex-wrap:wrap}.draggrid,.summary{grid-template-columns:1fr}.body{min-height:540px}.ghost{padding:8px 12px}.btn{padding:11px 12px}}
</style>
</head>
<body><main class="shell" id="shell"><header class="top"><div class="toprow"><div><div class="eyebrow">Командная энергия · практическое задание</div><h1>Как поддержать разные команды</h1><p>Компания «Контур» · четыре этапа выбора управленческих решений. Учитывайте задачи подразделения и то, что говорят его сотрудники.</p></div><button class="ghost" id="fullscreen" type="button">⛶ На весь экран</button></div><div id="progress" class="progress" aria-label="Ход выполнения"></div></header><section class="body" id="content" aria-live="polite"></section><footer class="foot"><div class="small" id="status">Этап 1 из 4</div><div class="controls"><button class="btn light" id="prev" type="button">← Назад</button><button class="btn primary" id="check" type="button">Проверить</button><button class="btn primary" id="next" type="button" hidden>Далее →</button></div></footer></main>
<script>
(()=>{
'use strict';
const steps=4;
const state={step:0,checked:[false,false,false,false],success:[false,false,false,false],answers:{},drag:{sale:null,shop:null,coord:null,design:null},picked:{},attempts:[0,0,0,0]};
const dCards=[
 {id:'s1',name:'Отдел продаж',txt:'Сотрудники завершили сложный контракт и сами предложили отметить командный результат.',correct:'sale'},
 {id:'s2',name:'Комплектовочная смена',txt:'Сотрудники говорят, что руководство замечает только ошибки и редко интересуется их работой.',correct:'shop'},
 {id:'s3',name:'Координаторы заказов',txt:'Работа зависает между продажами и складом, а сотрудники не могут сами согласовать замены.',correct:'coord'},
 {id:'s4',name:'Дизайнеры',txt:'Специалисты просят обсуждать замечания по макетам лично и давать конкретные критерии.',correct:'design'}
];
const targets=[['sale','Отметить командный результат'],['shop','Замечать личный вклад на рабочем месте'],['coord','Помочь разобрать процесс и полномочия'],['design','Давать адресную обратную связь']];
const selection={1:null,2:new Set(),3:null};
const questions={
 1:{title:'Не всем подходит публичная похвала',desc:'Павел собирается отметить результат отдела продаж. Большинство менеджеров предлагают общее чаепитие, но двое не хотят участвовать в публичном награждении. Как лучше поступить?',options:[
  ['a','Провести торжественное награждение всех: так будет справедливо.'],
  ['b','Обсудить комфортный формат: отметить общий результат, а личное признание сделать добровольным.'],
  ['c','Отменить благодарность всему отделу, раз мнения разделились.'],
  ['d','Поставить дополнительный план на следующую неделю вместо празднования.']
 ],correct:['b'],why:'Поддержка работает лучше, когда сотрудники действительно считают её подходящей. Общий результат можно отметить без обязательной публичности для каждого.'},
 2:{title:'Что поможет координаторам?',desc:'Координаторы заказов жалуются, что от них требуют ускорить отгрузки, но согласования между продажами и складом зависят от других руководителей. Выберите все действия, которые помогут им.',options:[
  ['a','Разобрать с координаторами две недавние задержки и определить, где они возникли.'],
  ['b','Согласовать с руководителями смежных отделов, кто вправе подтверждать замену.'],
  ['c','Еженедельно устраивать конкурс на самого быстрого координатора.'],
  ['d','Договориться, какую помощь координаторы могут запрашивать и кому сообщать о препятствиях.'],
  ['e','Добавить ежедневный подробный отчёт без изменения полномочий.']
 ],correct:['a','b','d'],why:'Координаторам необходимы ясные правила и возможность влиять на задержки. Конкурсы и дополнительная отчётность не устраняют организационные ограничения.'},
 3:{title:'Проверьте, что действительно помогло',desc:'Через две недели отдел продаж положительно оценил добровольное командное признание. В производстве сотрудники рады, что руководитель стал чаще замечать их вклад. Но координаторы по-прежнему не могут согласовать замены вовремя. Что делать?',options:[
  ['a','Распространить формат похвалы на все отделы, включая координаторов.'],
  ['b','Оставить удачные форматы в двух командах, а для координаторов уточнить, где задерживаются решения, и изменить порядок согласования.'],
  ['c','Подождать ещё месяц и не вмешиваться ни в один процесс.'],
  ['d','Объявить, что программа мотивации провалилась, поскольку помогла не всем.']
 ],correct:['b'],why:'У разных подразделений причины трудностей различаются. Подходящий формат сохраняют, а неэффективный пересматривают по конкретным рабочим данным.'}
};
const content=document.getElementById('content'), progress=document.getElementById('progress'),prev=document.getElementById('prev'),check=document.getElementById('check'),next=document.getElementById('next'),status=document.getElementById('status');
function esc(v){return String(v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
function cardMarkup(c){let cls='chip';if(state.checked[0])cls+= c.correct===placeOf(c.id)?' ok':' bad';return `<div tabindex="0" role="button" aria-label="Перетащить: ${esc(c.name)}" class="${cls}" draggable="true" data-card="${c.id}"><strong>${esc(c.name)}</strong>${esc(c.txt)}</div>`;}
function placeOf(cid){return Object.keys(state.drag).find(k=>state.drag[k]===cid)||null;}
function renderProgress(){progress.innerHTML=Array.from({length:steps},(_,i)=>`<div class="prog ${i<=state.step?'active':''}" title="Этап ${i+1}"></div>`).join('');}
function showFeedback(type, text){let fb=document.getElementById('feedback');if(fb){fb.className='feedback '+type;fb.textContent=text;fb.hidden=false;}}
function renderFirst(){
let unused=dCards.filter(c=>!placeOf(c.id));
content.innerHTML=`<div class="stepmark">ЭТАП 1 · СОПОСТАВЛЕНИЕ</div><h2>Подберите формат поддержки</h2><p class="desc">В четырёх подразделениях «Контура» сотрудники описали разные потребности. Перетащите карточки в подходящие области справа. Если передумали, перенесите карточку в другую область или верните в банк.</p><div class="draggrid"><div class="pool"><h3>Наблюдения сотрудников</h3><div class="chips" id="pool">${unused.map(cardMarkup).join('')}</div><div class="bankdrop" id="bank" data-drop="bank">↩ Перетащите сюда, чтобы вернуть карточку</div></div><div class="targets"><h3>Что попробует руководитель</h3>${targets.map(([id,label])=>`<div class="drop" data-drop="${id}" tabindex="0"><label>${label}</label>${state.drag[id]?cardMarkup(dCards.find(c=>c.id===state.drag[id])):''}</div>`).join('')}</div></div><div class="feedback neutral" id="feedback" ${state.checked[0]?'':'hidden'}>${state.checked[0]&&!state.success[0]?'Некоторые карточки не соответствуют описанным потребностям. Переместите выделенные красным и проверьте снова.':state.success[0]?'Вы выбрали поддержку по реальным запросам команд, а не только по названию отдела.':''}</div>`;
attachDrag();
}
function renderChoice(){
const st=state.step,q=questions[st];let multi=st===2,selected=multi?selection[2]:selection[st];
content.innerHTML=`<div class="stepmark">ЭТАП ${st+1} · ${multi?'НЕСКОЛЬКО РЕШЕНИЙ':'УПРАВЛЕНЧЕСКОЕ РЕШЕНИЕ'}</div><h2>${q.title}</h2><p class="desc">${q.desc}</p><div class="group">${q.options.map(([id,label])=>{const chosen=multi?selected.has(id):selected===id;let cls='option'+(chosen?' selected':'');if(state.checked[st]&&chosen)cls+=q.correct.includes(id)?' ok':' bad';return `<button class="${cls}" data-opt="${id}" type="button" aria-pressed="${chosen}"><b>${multi?'☐': '◯'} </b>${label}</button>`;}).join('')}</div><div id="feedback" class="feedback ${state.checked[st]?(state.success[st]?'ok':'bad'):'neutral'}" ${state.checked[st]?'':'hidden'}>${state.checked[st]?state.success[st]?q.why:'Проверьте, отвечает ли выбранное действие конкретной потребности подразделения. Можно изменить ответ и проверить ещё раз.':''}</div>`;
content.querySelectorAll('[data-opt]').forEach(el=>el.addEventListener('click',()=>{if(state.success[st])return;let id=el.dataset.opt;if(multi){if(selection[2].has(id))selection[2].delete(id);else selection[2].add(id);}else selection[st]=id;state.checked[st]=false;render();}));
}
function renderSummary(){content.innerHTML=`<div class="stepmark">ПРАКТИКА ЗАВЕРШЕНА</div><h2>План поддержки разных подразделений</h2><p class="desc">Вы подобрали разные способы поддержки с учётом рабочих обстоятельств и обратной связи от сотрудников. Используйте эти принципы, когда будете выбирать форматы мотивации для своих команд.</p><div class="summary"><div class="summcard"><h3>Продажи</h3><p>Отмечать конкретные достижения, согласовывая комфортный формат признания.</p></div><div class="summcard"><h3>Производственная смена</h3><p>Замечать личный вклад сотрудников и спрашивать о трудностях непосредственно на рабочем месте.</p></div><div class="summcard"><h3>Координаторы</h3><p>Разбирать препятствия, уточнять полномочия и обеспечивать помощь смежных отделов.</p></div><div class="summcard"><h3>Творческие специалисты</h3><p>Давать предметную обратную связь и учитывать предпочтения относительно формата обсуждения.</p></div></div><div class="hint"><b>Проверка через две недели:</b> спросите сотрудников, что изменилось, и сопоставьте ответы с наблюдаемыми результатами работы. Если поддержка не помогает, пересмотрите способ, а не обвиняйте людей в отсутствии мотивации.</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="save" type="button">↓ Сохранить итоговый план</button><button class="btn light" id="restart" type="button">Попробовать снова</button></div>`;
document.getElementById('save').addEventListener('click',()=>{let txt='Урок 21. Как выбирать способы мотивации для разных подразделений\n\nПродажи: отмечать результат, учитывая пожелания сотрудников.\nПроизводство: замечать индивидуальный вклад, общаться с людьми на рабочем месте.\nКоординаторы: устранять организационные ограничения и помогать договариваться между подразделениями.\nТворческие специалисты: адресная обратная связь, уважение к формату работы и личным границам.\n\nПроверка через две недели: спросить о полезности; сопоставить с результатами; при необходимости скорректировать.\n';let blob=new Blob([txt],{type:'text/plain;charset=utf-8'});let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download='План_мотивации_подразделений.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);});
document.getElementById('restart').addEventListener('click',()=>{state.step=0;state.checked.fill(false);state.success.fill(false);state.drag={sale:null,shop:null,coord:null,design:null};selection[1]=null;selection[2].clear();selection[3]=null;render();});}
let activeCard=null,clone=null;
function move(cid,target){if(!cid || state.success[0])return;let old=placeOf(cid);if(old)state.drag[old]=null;if(target!=='bank'){let prevId=state.drag[target];if(prevId&&prevId!==cid){}state.drag[target]=cid;}state.checked[0]=false;render();}
function attachDrag(){
content.querySelectorAll('[data-card]').forEach(el=>{
el.addEventListener('dragstart',e=>{activeCard=el.dataset.card;e.dataTransfer.setData('text/plain',activeCard);e.dataTransfer.effectAllowed='move';});
el.addEventListener('dragend',()=>{activeCard=null;});
// Pointer dragging enables the same physical drag on touch screens.
let ps=null;el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;ps={x:e.clientX,y:e.clientY,id:e.pointerId,dragged:false};});
el.addEventListener('pointermove',e=>{if(!ps||ps.id!==e.pointerId)return;let dx=e.clientX-ps.x,dy=e.clientY-ps.y;if(!ps.dragged&&Math.hypot(dx,dy)<8)return;if(!ps.dragged){ps.dragged=true;el.setPointerCapture(e.pointerId);clone=el.cloneNode(true);clone.classList.add('pointerclone');document.body.appendChild(clone);}if(clone){clone.style.left=e.clientX+'px';clone.style.top=e.clientY+'px';}});
el.addEventListener('pointerup',e=>{if(!ps||ps.id!==e.pointerId)return;if(ps.dragged){if(clone){clone.remove();clone=null;}let node=document.elementFromPoint(e.clientX,e.clientY),target=node&&node.closest('[data-drop]');if(target)move(el.dataset.card,target.dataset.drop);}ps=null;});
});
content.querySelectorAll('[data-drop]').forEach(drop=>{drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hover');});drop.addEventListener('dragleave',()=>drop.classList.remove('hover'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hover');move(e.dataTransfer.getData('text/plain')||activeCard,drop.dataset.drop);});});
}
function validate(){const st=state.step; if(st===0){if(Object.values(state.drag).some(v=>!v)){showFeedback('neutral','Перетащите все четыре карточки в области справа, затем проверьте.');return;}state.checked[0]=true;state.success[0]=dCards.every(c=>c.correct===placeOf(c.id));}else {const q=questions[st];let answer=st===2?Array.from(selection[2]):selection[st]?[selection[st]]:[];if(!answer.length){showFeedback('neutral','Сначала выберите ответ.');return;}state.checked[st]=true;state.success[st]=answer.length===q.correct.length&&answer.every(id=>q.correct.includes(id));}state.attempts[st]++;render();}
function render(){renderProgress();let st=state.step;if(st===4)renderSummary();else if(st===0)renderFirst();else renderChoice();status.textContent=st===4?'Все этапы пройдены':`Этап ${st+1} из ${steps}`;prev.disabled=st===0;check.hidden=st===4||state.success[st];next.hidden=st===4||!state.success[st];next.textContent=st===3?'Завершить →':'Далее →';}
prev.addEventListener('click',()=>{if(state.step>0){state.step--;render();}});
check.addEventListener('click',validate);
next.addEventListener('click',()=>{if(state.success[state.step]){state.step++;render();}});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.getElementById('shell').requestFullscreen();else await document.exitFullscreen();}catch(e){/* browser may restrict full screen */}});
render();
})();
</script>
</body></html>
