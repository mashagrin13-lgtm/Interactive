<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Антикризисный штаб — Командная энергия</title>
<style>
  :root { --ink:#16293a;--slate:#526576;--teal:#0d746b;--teall:#eaf7f4;--light:#f3f6f8;--border:#dce6eb;--warm:#fcf5e9;--orange:#915b22;--bad:#9b3c34;--good:#0e695a; }
  *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f6f8fa,#e9f0f2);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);line-height:1.5}main{max-width:960px;margin:28px auto 52px;padding:0 16px} .frame{background:white;border:1px solid var(--border);border-radius:22px;box-shadow:0 12px 40px rgba(18,51,68,.09);overflow:hidden}.head{padding:28px 32px 22px;background:linear-gradient(120deg,#153448,#0c6b67);color:white}.kicker{font-size:12px;letter-spacing:.13em;text-transform:uppercase;opacity:.85;font-weight:700}.head h1{font-size:clamp(24px,4vw,34px);font-weight:760;letter-spacing:-.035em;line-height:1.16;margin:7px 0 10px}.head p{max-width:720px;margin:0;color:#e0f2ef}.steps{display:flex;gap:7px;margin-top:20px}.seg{height:6px;border-radius:8px;flex:1;background:rgba(255,255,255,.25)}.seg.on{background:#b9f0d9}.body{padding:28px 32px 32px}.step-label{color:var(--teal);font-size:12px;font-weight:760;letter-spacing:.09em;text-transform:uppercase}.body h2{font-size:23px;letter-spacing:-.025em;line-height:1.3;margin:6px 0 8px}.lead{color:var(--slate);margin:0 0 20px}.fact-list{display:grid;gap:10px}.fact-row{border:1px solid var(--border);border-radius:12px;display:grid;grid-template-columns:1fr auto;gap:14px;padding:13px 14px;align-items:center}.fact-row p{margin:0;font-size:15px}.pillgroup{display:flex;gap:5px}.pill{border:1px solid #cbd9de;border-radius:18px;background:white;color:var(--slate);font:inherit;font-size:12px;font-weight:700;padding:8px 11px;cursor:pointer}.pill[aria-pressed='true']{border-color:var(--teal);color:var(--teal);background:var(--teall)}.pill:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9ccbc2;outline-offset:2px}.btn{border:0;border-radius:11px;background:var(--teal);color:white;font:inherit;font-size:14px;font-weight:730;padding:12px 20px;cursor:pointer;transition:opacity .15s}.btn:hover{opacity:.9}.btn:disabled{opacity:.45;cursor:not-allowed}.ghost{background:white;border:1px solid var(--border);color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px}.feedback{margin-top:16px;border:1px solid #a9d6cb;background:#f0faf6;border-radius:13px;padding:15px 17px;font-size:14px}.feedback.warn{background:var(--warm);border-color:#edcda4}.feedback strong{display:block;margin-bottom:4px}.sms{background:#f5f8fa;border:1px solid var(--border);padding:15px 18px;border-radius:13px;margin:8px 0}.sms small{display:block;color:var(--teal);font-weight:800;margin-bottom:5px}.choices{display:grid;gap:10px;margin-top:18px}.choice{cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:12px;line-height:1.45}.choice:hover{background:#f8fcfb}.choice:has(input:checked){border-color:#68afa3;background:var(--teall)}.choice input{accent-color:var(--teal);margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#f7fafb;border:1px solid var(--border);border-radius:13px;padding:17px}.panel h3{font-size:16px;margin:0 0 10px}.panel label{font-size:14px}.select{width:100%;border:1px solid #c9d9de;border-radius:9px;font:inherit;padding:11px;line-height:1.4;color:var(--ink);background:white;margin-top:8px}.row3{display:grid;grid-template-columns:1.2fr .8fr 1.3fr;gap:10px}.field label{display:block;font-size:12px;font-weight:720;color:var(--slate);margin:12px 0 6px}.field input{width:100%;font:inherit;font-size:14px;border-radius:9px;border:1px solid #c9d9de;padding:10px;background:#fff;min-width:0}.result{background:#f4faf7;border:1px solid #bbdcd1;border-radius:13px;padding:18px;margin:15px 0}.result h3{margin:0 0 8px}.result p{margin:8px 0}.end-note{font-size:12px;color:var(--slate);margin-top:15px}.hide{display:none!important}@media(max-width:650px){.head,.body{padding:22px 19px}.grid,.row3{grid-template-columns:1fr}.fact-row{grid-template-columns:1fr}.pillgroup{justify-content:flex-start}.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
</head>
<body>
<main><article class="frame"><header class="head"><div class="kicker">Курс «Командная энергия» · урок 3</div><h1>Антикризисный штаб</h1><p>Вы — Марина Орлова, операционный директор компании «Контур». В компании задерживают заказы, руководители спорят о причинах, а сотрудники ждут ясности. Пройдите четыре шага и подготовьте решение на ближайшие 24 часа.</p><div class="steps" id="steps"></div></header><section class="body" id="scene"></section></article></main>
<script>
(()=>{'use strict';let stage=0;let facts={},answer='',planA='',planB='';let checkedFacts=false, checkedDecision=false, checkedPlans=false;
const statements=[
 ['За шесть недель доля заказов в срок снизилась с 89 до 73%.','fact'],
 ['Руководители продаж и производства спорят о причинах задержек.','fact'],
 ['Все задержки вызваны неорганизованностью производства.','unknown'],
 ['Клиентский сервис получает обращения о задержках.','fact'],
 ['Все крупные клиенты скоро уйдут к конкурентам.','unknown'],
 ['Текущая загрузка позволяет выполнить все обещанные сроки.','unknown']
];
const s=document.getElementById('scene');const progress=document.getElementById('steps');const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){progress.innerHTML=Array.from({length:4},(_,i)=>`<div class="seg ${i<=stage?'on':''}" aria-label="Этап ${i+1}"></div>`).join('')}
function fb(target,good,head,text){document.getElementById(target).innerHTML=`<div class="feedback ${good?'':'warn'}" role="status"><strong>${head}</strong>${text}</div>`}
function footer(button='Следующий этап'){return `<div class="actions"><button class="btn" id="next" disabled>${button} →</button>${stage>0?'<button class="btn ghost" id="back">← Назад</button>':''}</div>`}
function bindNav(){const nx=document.getElementById('next');const bk=document.getElementById('back');nx?.addEventListener('click',()=>{stage=Math.min(3,stage+1);render()});bk?.addEventListener('click',()=>{stage=Math.max(0,stage-1);render()})}
function render(){nav();if(stage===0){s.innerHTML=`<div class="step-label">Шаг 1 из 4 · 09:00</div><h2>Отделите факты от предположений</h2><p class="lead">У Марины есть только часть информации. Для каждого утверждения выберите: оно подтверждено имеющимися данными или его ещё предстоит проверить.</p><div class="fact-list">${statements.map((x,i)=>`<div class="fact-row"><p>${esc(x[0])}</p><div class="pillgroup"><button class="pill" data-i="${i}" data-v="fact" aria-pressed="${facts[i]==='fact'}">Факт</button><button class="pill" data-i="${i}" data-v="unknown" aria-pressed="${facts[i]==='unknown'}">Проверить</button></div></div>`).join('')}</div><div class="actions"><button class="btn" id="check">Проверить разбор</button></div><div id="feedback"></div>${footer()}`;s.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',()=>{facts[b.dataset.i]=b.dataset.v;s.querySelectorAll(`[data-i="${b.dataset.i}"]`).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===b.dataset.v)));document.getElementById('feedback').innerHTML='';document.getElementById('next').disabled=true}));document.getElementById('check').onclick=()=>{if(Object.keys(facts).length!==statements.length){fb('feedback',false,'Не все утверждения разобраны','Выберите категорию для каждого утверждения.');return}const errors=statements.filter((x,i)=>facts[i]!==x[1]);checkedFacts=errors.length===0;fb('feedback',checkedFacts,checkedFacts?'Категории определены верно':'Есть неточности',checkedFacts?'Измеренные показатели и поступившие обращения — факты. Объяснения причин и прогнозы требуют проверки. Теперь можно обсуждать действия.':'Проверенный результат и предположение о его причинах — разные вещи. Пересмотрите отмеченные позиции: одни содержат данные, другие — только объяснения или прогнозы.');document.getElementById('next').disabled=!checkedFacts};bindNav()}
else if(stage===1){s.innerHTML=`<div class="step-label">Шаг 2 из 4 · 09:20</div><h2>Соберите руководителей вокруг задачи</h2><p class="lead">В рабочий чат поступили сообщения. Что Марине стоит сказать в начале экстренного разговора?</p><div class="sms"><small>Павел · продажи</small>Клиенты ждут подтверждения сроков. Пока не понимаю, что им обещать.</div><div class="sms"><small>Олег · производство</small>Часть дат со мной не согласовали. Нужно проверить загрузку и материалы.</div><div class="sms"><small>Дарья · HR</small>Сотрудники спрашивают, что будет с планами и нагрузкой.</div><div class="choices">${[
 ['a','«Сначала сверим обязательства, загрузку и то, что ещё не подтверждено».'],
 ['b','«Вначале выясним, кто из руководителей допустил ошибки».'],
 ['c','«Сообщим всем, что причин беспокоиться нет, и продолжим работу».']
 ].map(x=>`<label class="choice"><input type="radio" name="answer" value="${x[0]}" ${answer===x[0]?'checked':''}><span>${esc(x[1])}</span></label>`).join('')}</div><div class="actions"><button class="btn" id="check">Разобрать решение</button></div><div id="feedback"></div>${footer()}`;s.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{answer=el.value;document.getElementById('feedback').innerHTML='';document.getElementById('next').disabled=true});document.getElementById('check').onclick=()=>{if(!answer){fb('feedback',false,'Выберите начало разговора','Без этого нельзя перейти к обсуждению сценариев.');return}checkedDecision=answer==='a';fb('feedback',checkedDecision,checkedDecision?'Хорошее начало':'Попробуйте вернуться к фактам',checkedDecision?'Вы не обещаете того, чего пока не знаете. Сначала руководители уточняют обязательства и возможности, потом выбирают решение.':'Назначение виновных или безусловное успокоение сотрудников не добавляет проверенной информации. В ситуации неопределённости руководителям нужно сначала сверить факты.');document.getElementById('next').disabled=!checkedDecision};bindNav()}
else if(stage===2){s.innerHTML=`<div class="step-label">Шаг 3 из 4 · 10:00</div><h2>Подготовьте план А и план Б</h2><p class="lead">План А описывает ближайшие действия на основе доступных ресурсов. План Б нужен на случай, если проверка покажет, что прежние обязательства выполнить невозможно.</p><div class="grid"><div class="panel"><h3>План А: что делаем сейчас?</h3><label for="a">Выберите действие, которое не требует придумывать недостающие данные.</label><select id="a" class="select"><option value="">— Выберите —</option><option value="a">Проверяем приоритетные заказы и подтверждаем выполнимые сроки.</option><option value="b">Обещаем клиентам все прежние сроки, чтобы успокоить их.</option><option value="c">Сразу отменяем все новые заказы на неопределённое время.</option></select></div><div class="panel"><h3>План Б: когда переключаемся?</h3><label for="b">Выберите сигнал, при котором требуется иной сценарий.</label><select id="b" class="select"><option value="">— Выберите —</option><option value="a">Когда подтверждённая загрузка не позволяет выполнить обещанные сроки.</option><option value="b">Когда руководители снова выразят недовольство ситуацией.</option><option value="c">После любого очередного рабочего совещания.</option></select></div></div><div class="actions"><button class="btn" id="check">Проверить сценарии</button></div><div id="feedback"></div>${footer()}`;document.getElementById('a').value=planA;document.getElementById('b').value=planB;document.getElementById('a').onchange=e=>{planA=e.target.value;document.getElementById('next').disabled=true};document.getElementById('b').onchange=e=>{planB=e.target.value;document.getElementById('next').disabled=true};document.getElementById('check').onclick=()=>{checkedPlans=planA==='a'&&planB==='a';fb('feedback',checkedPlans,checkedPlans?'Сценарии согласованы':'Перепроверьте планы',checkedPlans?'План А начинается с уточнения реальных возможностей. План Б запускается по наблюдаемому признаку, а не по настроению участников.':'План А должен опираться на проверяемые обязательства, а переход к плану Б — на фактическое ограничение возможностей компании.');document.getElementById('next').disabled=!checkedPlans};bindNav()}
else{s.innerHTML=`<div class="step-label">Шаг 4 из 4 · 10:15</div><h2>Назначьте действия на ближайшие сутки</h2><p class="lead">Укажите, кому поручены первые проверки и к какому сроку нужны результаты. Затем сформируйте короткое сообщение для команды.</p><div class="panel"><h3>Решение 1. Сроки и загрузка</h3><div class="row3"><div class="field"><label for="owner1">Ответственный</label><input id="owner1" value="Олег"></div><div class="field"><label for="when1">Срок</label><input id="when1" value="Сегодня, 12:00"></div><div class="field"><label for="proof1">Что принесёт на проверку</label><input id="proof1" value="План-график приоритетных заказов"></div></div></div><div class="panel" style="margin-top:12px"><h3>Решение 2. Обязательства перед клиентами</h3><div class="row3"><div class="field"><label for="owner2">Ответственный</label><input id="owner2" value="Юлия и Павел"></div><div class="field"><label for="when2">Срок</label><input id="when2" value="Сегодня, 13:00"></div><div class="field"><label for="proof2">Что принесут на проверку</label><input id="proof2" value="Список обращений и спорных сроков"></div></div></div><div class="actions"><button class="btn" id="report">Сформировать сообщение</button><button class="btn ghost" id="restart">Начать заново</button></div><div id="result"></div><div class="end-note">Сценарий компании «Контур» учебный. Этот интерактив не сохраняет решения между уроками. Перенесите итог в Excel-шаблон «Штаб ясности», чтобы использовать его в собственной работе.</div>`;document.getElementById('restart').onclick=()=>{stage=0;facts={};answer='';planA='';planB='';render()};document.getElementById('report').onclick=()=>{const ids=['owner1','when1','proof1','owner2','when2','proof2'];const vals=ids.map(i=>document.getElementById(i).value.trim());if(vals.some(v=>!v)){document.getElementById('result').innerHTML='<div class="feedback warn">Заполните все поля по двум действиям.</div>';return}const report=`ШТАБ ЯСНОСТИ / КОНТУР\nФакты: доля заказов в срок снизилась с 89 до 73%; поступают обращения о задержках.\nНеизвестно: точные причины задержек и выполнимость всех ранее обещанных сроков.\nПлан А: проверяем критичные заказы, подтверждаем реальные сроки.\nПлан Б: если загрузка не позволяет исполнить обязательства, перепланируем производство и пересогласовываем сроки.\n1. ${vals[0]} — ${vals[2]}, срок: ${vals[1]}.\n2. ${vals[3]} — ${vals[5]}, срок: ${vals[4]}.\nСледующая сверка: сегодня после получения данных.`;document.getElementById('result').innerHTML=`<div class="result"><h3>Сообщение команде</h3><p>«Коллеги, за шесть недель доля заказов, выполненных в срок, снизилась с 89 до 73%. Мы проверяем причины задержек и реальные возможности производства. Сегодня сверим приоритетные заказы и обращения клиентов. После проверки согласуем сроки и следующий план действий».</p><p><strong>Назначено:</strong> ${esc(vals[0])} — ${esc(vals[2])} (${esc(vals[1])}); ${esc(vals[3])} — ${esc(vals[5])} (${esc(vals[4])}).</p><button class="btn" id="save">Сохранить итог .txt</button></div>`;document.getElementById('save').onclick=()=>{const url=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Штаб_ясности_Контур.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}}
}
render();})();
</script></body></html>
