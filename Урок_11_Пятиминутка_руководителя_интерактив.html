<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Антикризисная пятиминутка · Компания «Контур»</title>
<style>
:root {--navy:#18344e; --blue:#236389; --bg:#eef3f7; --ink:#233346; --mute:#596b7e; --line:#dbe4ec; --teal:#087e76; --amber:#a8650d; --bad:#aa3941}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5}.wrap{max-width:900px;margin:30px auto;padding:0 18px}.top{background:var(--navy);color:white;padding:27px 31px;border-radius:18px 18px 0 0}.top h1{margin:0;font-size:27px;line-height:1.19}.top p{margin:11px 0 0;color:#d9eaf4;font-size:14px}.main{background:#fff;border:1px solid var(--line);border-radius:0 0 18px 18px;padding:26px 30px 30px;box-shadow:0 12px 28px #19344e13}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--mute);font-weight:600}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 23px}.progress span{height:7px;background:#e5edf2;border-radius:20px}.progress span.done{background:var(--teal)}.progress span.active{background:#7abbd3}.time{color:var(--teal);font-weight:700;font-size:14px}.heading{font-size:23px;line-height:1.25;margin:6px 0 14px}.case{background:#f3f7fa;border-left:4px solid #5a9dbc;padding:15px 17px;border-radius:8px;margin-bottom:19px}.question{font-size:16px;font-weight:700;margin:10px 0 13px}.options{display:grid;gap:10px}.choice{width:100%;display:block;border:1.5px solid #dae3ec;background:#fff;border-radius:11px;padding:15px 17px;text-align:left;font-size:15px;line-height:1.4;color:var(--ink);cursor:pointer;transition:.15s}.choice:hover{border-color:var(--blue);background:#f4fafe}.choice:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid #7ec5e6;outline-offset:2px}.choice:disabled{cursor:default}.choice.selected{border-color:var(--blue);background:#eaf5fb}.choice.good{border-color:#399c87;background:#e7f6ee}.choice.miss{border-color:#cd9095;background:#fceff0}.feedback{margin-top:18px;padding:18px;border-radius:12px;background:#eff7f5;border:1px solid #c6e5dd}.feedback h3{margin:0 0 7px;color:#145f57;font-size:16px}.feedback p{margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:20px}.primary,.secondary{border:0;border-radius:10px;padding:11px 19px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:white}.primary:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#ecf2f6;color:var(--navy)}.small{font-size:13px;color:var(--mute)}.finish{background:#f1f8f6;border:1px solid #b9d8cf;padding:18px;border-radius:12px}.finish h2{margin:0 0 5px;font-size:23px}.finish p{margin:0 0 12px}.log{margin:18px 0 0;padding-left:18px}.log li{padding:7px 0}.score{font-size:32px;font-weight:800;color:var(--navy)}.footer{font-size:12px;color:#67788b;text-align:center;padding:12px}.hidden{display:none}@media(max-width:580px){.wrap{margin:0;padding:0}.top,.main{border-radius:0;padding:20px}.top h1{font-size:24px}.heading{font-size:21px}.meta{font-size:12px}.choice{font-size:14px}}
</style>
</head>
<body><div class="wrap"><header class="top"><h1>Пятиминутка руководителя</h1><p>Интерактивная симуляция · Компания «Контур» · 5 решений за одно короткое совещание</p></header><main class="main"><div id="app" aria-live="polite"></div></main><div class="footer">Учебная ситуация вымышленная. Принцип встречи основан на опыте Ирины Пуц: цифры, факты, заявки, планы.</div></div>
<script>
const rounds=[
 {time:'0:00–0:30',title:'Соберите команду вокруг одного вопроса',case:'Утром Юлия сообщает Марине, что два клиента получили обещание отгрузки в четверг. Производство ориентируется на пятницу. Павел и Олег уже готовы объяснять, почему виновато другое подразделение.',q:'Как Марине начать пятиминутку?',options:[
  {text:'«Сейчас определим, какие сроки подтверждены по двум заказам и кто проверит расхождения до полудня».',score:2,fb:'У встречи появилась узкая и проверяемая цель. Это помогает не уходить в общий разбор отношений между подразделениями.'},
  {text:'«Давайте вспомним, как вообще возникла проблема с согласованием сроков».',score:0,fb:'Вопрос может быть важен, но широкий разбор процесса не поместится в пять минут. Назначьте его отдельно после срочной сверки фактов.'},
  {text:'«Я хочу услышать объяснение каждого, кто допустил эту ситуацию».',score:0,fb:'Такое начало переводит встречу к оправданиям. Сначала требуется выяснить реальные сроки и защитить клиентов от противоречивых обещаний.'}
 ]},
 {time:'0:30–1:30',title:'Отделите факты от оценок',case:'На экране доски видны три числа: 78% заказов выполнены в срок, 13 обращений клиентов остаются открытыми, по двум заказам даты не совпадают. Павел говорит, что производство «вечно тормозит».',q:'Что Марина попросит назвать?',options:[
  {text:'Источник информации по двум заказам, подтверждённые даты и время последнего обновления.',score:2,fb:'Цифры, заявки и даты позволяют быстро проверить ситуацию. Оценка «вечно тормозит» не сообщает, какой срок можно обещать клиентам.'},
  {text:'Список всех задержек за прошлый месяц, чтобы увидеть полную картину.',score:1,fb:'Данные за месяц пригодятся для отдельного анализа. На пятиминутке важнее конкретные заказы, из-за которых сегодня возник риск.'},
  {text:'Мнение каждого участника о том, кто больше всего ошибается.',score:0,fb:'Обсуждение впечатлений не даёт проверяемого решения. Верните разговор к цифрам и документам.'}
 ]},
 {time:'1:30–2:30',title:'Остановите разговор по кругу',case:'Олег начинает подробно вспоминать старые претензии к продажам. Павел перебивает и перечисляет проблемы производства. Прошла уже половина времени, а новые факты не появились.',q:'Как Марине вернуть встречу к делу?',options:[
  {text:'«Коллеги, прошлые разногласия разберём отдельно. Сейчас нужен ответ: чего мы не знаем по этим заказам и кто проверит?»',score:2,fb:'Вы отделили срочную сверку данных от более глубокой проблемы. Это позволяет сохранить короткий формат и не замолчать конфликт навсегда.'},
  {text:'«Хорошо, каждому дам по две минуты, чтобы высказать всё накопившееся».',score:0,fb:'Для отдельного разговора такой формат может быть уместен. Внутри пятиминутки он съест всё время и оставит команду без решения.'},
  {text:'«Не обсуждаем вообще никаких проблем между отделами».',score:1,fb:'Вы остановили спор, но рискуете создать ощущение замалчивания проблемы. Лучше назначить отдельный разбор, объяснив, что прямо сейчас требуется срочное действие.'}
 ]},
 {time:'2:30–4:20',title:'Закрепите ближайшее действие',case:'После сверки данных стало ясно: в CRM указана прежняя дата, а актуальная производственная загрузка ещё не проверена. Юлия не может уверенно отвечать клиентам.',q:'Какую договорённость Марина должна зафиксировать?',options:[
  {text:'Олег проверяет график до 10:30, Павел согласует дату в CRM до 11:00, Юлия информирует клиентов до 12:00.',score:2,fb:'Есть три конкретных действия, владельцы и сроки. Команда понимает, что должна проверить и когда информация станет надёжной.'},
  {text:'«Все участники должны внимательнее относиться к срокам и лучше взаимодействовать».',score:0,fb:'Формулировка не позволяет проверить результат: непонятно, кто, что и когда делает.'},
  {text:'«Павел сейчас сообщит клиентам пятницу, чтобы они не звонили лишний раз».',score:0,fb:'Срок ещё не подтверждён. Новое поспешное обещание может усилить кризис доверия и вызвать повторные жалобы.'}
 ]},
 {time:'4:20–5:00',title:'Закройте встречу ясным сообщением',case:'Пять минут почти закончились. Общая причина расхождений пока не установлена, но ответственные за проверку назначены. Сотрудники соседних отделов видят разные сроки.',q:'Как Марине завершить пятиминутку?',options:[
  {text:'Кратко назвать подтверждённые факты, действия и сроки; пообещать обновление до 12:00 и закончить встречу.',score:2,fb:'Финал даёт команде точку опоры: что известно, что проверяется, кто делает следующий шаг и когда появится обновление.'},
  {text:'Сказать, что скоро всё обязательно наладится и поводов беспокоиться нет.',score:0,fb:'Уверенность важна, но неподтверждённое обещание не заменяет факт. Людям нужна ясность о действиях и времени следующего сообщения.'},
  {text:'Остаться всем вместе до тех пор, пока не будут известны абсолютно все причины.',score:0,fb:'Это уже другое совещание. Срочные действия назначены, а углублённый разбор можно провести позже с нужными участниками.'}
 ]}
];
let step=0,choice=null,results=[];
const app=document.getElementById('app');
function safe(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 if(step>=rounds.length){finish();return;}
 const r=rounds[step], header=`<div class="meta"><span>Этап ${step+1} из ${rounds.length}</span><span>Учебная шкала времени • ${r.time}</span></div><div class="progress">${rounds.map((_,i)=>`<span class="${i<step?'done':i===step?'active':''}"></span>`).join('')}</div>`;
 let choices=r.options.map((o,i)=>`<button type="button" class="choice ${choice===i?'selected':''} ${choice!==null&&i===choice?(o.score===2?'good':'miss'):''}" data-index="${i}" ${choice!==null?'disabled':''}><strong>${'АБВ'[i]}.</strong> ${safe(o.text)}</button>`).join('');
 let feedback=choice===null?'':`<div class="feedback"><h3>${r.options[choice].score===2?'Подходит для пятиминутки':r.options[choice].score===1?'Частично подходит':'Стоит изменить подход'}</h3><p>${safe(r.options[choice].fb)}</p></div>`;
 app.innerHTML=header+`<div class="time">${r.time}</div><h2 class="heading">${safe(r.title)}</h2><div class="case">${safe(r.case)}</div><p class="question">${safe(r.q)}</p><div class="options">${choices}</div>${feedback}<div class="actions"><button type="button" class="primary" id="next" ${choice===null?'disabled':''}>${step===rounds.length-1?'Посмотреть итог':'Следующий этап →'}</button></div>`;
 app.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{choice=Number(b.dataset.index);results[step]=choice;render();}));
 app.querySelector('#next').addEventListener('click',()=>{if(choice===null)return;step++;choice=null;render();window.scrollTo({top:0,behavior:'smooth'});});
}
function finish(){let score=results.reduce((n,i,k)=>n+rounds[k].options[i].score,0);const label=score>=9?'Вы удержали короткий и предметный формат':score>=6?'Основа верная, но часть решений можно уточнить':'Пятиминутка рисковала превратиться в длинное обсуждение';
 let rows=results.map((i,k)=>`<li><strong>${safe(rounds[k].title)}:</strong> ${safe(rounds[k].options[i].text)}<div class="small">${safe(rounds[k].options[i].fb)}</div></li>`).join('');
 app.innerHTML=`<div class="finish"><div class="small">Результат тренировки</div><div class="score">${score} / 10</div><h2>${safe(label)}</h2><p>Ключевой принцип: цифры, факты, заявки и планы. Каждая пятиминутка должна закончиться конкретным действием, ответственным и сроком следующей проверки. Это учебный балл, а не оценка ваших управленческих компетенций.</p></div><h3>Ваши решения</h3><ol class="log">${rows}</ol><div class="actions"><button class="secondary" id="restart">Пройти ещё раз</button><button class="primary" id="save">Сохранить протокол (.txt)</button></div>`;
 document.getElementById('restart').addEventListener('click',()=>{step=0;choice=null;results=[];render();});
 document.getElementById('save').addEventListener('click',()=>{const txt=['ПЯТИМИНУТКА РУКОВОДИТЕЛЯ — учебный протокол','Компания «Контур»','Результат: '+score+' из 10','',...results.flatMap((j,k)=>[`${k+1}. ${rounds[k].title} (${rounds[k].time})`,`Решение: ${rounds[k].options[j].text}`,`Разбор: ${rounds[k].options[j].fb}`,'']),'Что взять в работу: цифры, факты, заявки, планы; по каждому действию определить ответственного, срок и способ проверки.'].join('\n');const blob=new Blob(['\uFEFF'+txt],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Протокол_пятиминутки_Контур.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
}
render();
</script></body></html>
