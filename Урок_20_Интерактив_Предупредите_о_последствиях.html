<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Урок 20. Предупредите о последствиях</title>
<style>
:root{--ink:#172638;--muted:#61748a;--line:#d8e2ed;--navy:#12283c;--sea:#067d77;--bg:#f3f6fa;--paper:#fff;--orange:#d88945;--bad:#a83737;--good:#137350}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.42;cursor:default}.shell{max-width:1090px;margin:22px auto;padding:0 18px}.top{background:var(--navy);color:#fff;border-radius:16px 16px 0 0;padding:23px 30px 22px;display:flex;justify-content:space-between;gap:22px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:750;text-transform:uppercase;color:#a8dbd6}.top h1{font-size:26px;line-height:1.18;font-weight:740;letter-spacing:-.035em;margin:7px 0}.top p{margin:0;color:#d2dfea;max-width:660px}.top .fullscreen{white-space:nowrap;border:1px solid #688096;color:#fff;background:transparent;border-radius:9px;padding:9px 13px;font-size:13px}.main{background:#fff;border:1px solid #e2e9f2;border-top:0;border-radius:0 0 16px 16px;box-shadow:0 9px 30px #1423380e;padding:22px 30px 25px}.progress{display:flex;gap:7px;margin-bottom:20px}.progress i{height:5px;border-radius:5px;background:#e6edf3;flex:1}.progress i.current{background:var(--sea)}.progress i.done{background:#67b5a8}.content h2{font-size:22px;line-height:1.22;letter-spacing:-.018em;margin:0 0 10px}.content p{margin:0 0 12px}.case{border-left:4px solid #d7a66d;background:#f8f7f3;padding:12px 16px;border-radius:0 10px 10px 0;margin:11px 0 17px}.case strong{font-weight:720}.instruction{color:#4d647c;margin:0 0 11px;font-weight:550}.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bin{background:#f6f9fb;border:1.5px dashed #afc4d1;border-radius:11px;padding:11px;min-height:156px}.bin.over,.bank.over{border-color:#0c8880;background:#effaf7}.bin h3{font-size:14px;margin:0 0 6px;line-height:1.3}.bin p{font-size:12px;color:var(--muted);margin:0 0 11px}.bank{border:1.5px dashed #ccd8e3;border-radius:11px;padding:11px;min-height:66px;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.banktitle{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#607287;font-weight:700;margin-top:12px}.chip{background:white;border:1px solid #bfd0de;border-radius:9px;padding:11px 12px;box-shadow:0 1px 3px #1427380a;cursor:grab;user-select:none;font-size:13px;line-height:1.4;position:relative}.chip:active{cursor:grabbing}.chip.selected{border-color:#078b80;background:#f1fbf8}.chip.invalid{border-color:var(--bad);background:#fff0f0;color:#772d2d}.chip.valid{border-color:var(--good);background:#effaf4}.chip .return{margin-left:8px;display:inline-block;background:#e8eef5;border:none;color:#456276;border-radius:6px;padding:1px 6px;font-size:14px;cursor:pointer}.choices{display:grid;gap:9px}.choice{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:1.5px solid #dce4ed;background:#fff;border-radius:11px;padding:13px 14px;line-height:1.4;color:var(--ink);transition:border-color .15s,background .15s}.choice:hover{border-color:#70a4a4}.choice.active{background:#f1faf9;border-color:#048c84}.choice.invalid{background:#fff0f0;border-color:var(--bad)}.choice.valid{background:#edfaf2;border-color:var(--good)}.mark{flex:none;width:23px;height:23px;border-radius:7px;background:#eef2f7;color:#557089;display:grid;place-items:center;font-size:12px;font-weight:750}.choice.active .mark{background:#138d85;color:#fff}.choice.invalid .mark{background:#b74848;color:#fff}.choice.valid .mark{background:#188056;color:#fff}.notice{border-radius:9px;padding:12px 14px;font-size:13px;margin-top:13px;line-height:1.45}.notice.bad{background:#fff3ee;color:#7c3b24}.notice.good{background:#edf8f1;color:#1b6945}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;border-top:1px solid #e8edf4;margin-top:22px;padding-top:17px}.btn{border:1px solid #cbd8e5;padding:10px 16px;border-radius:9px;background:#fff;color:var(--ink);font-size:13px;font-weight:680}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.teal{background:#087f77;border-color:#087f77;color:#fff}.stretch{flex:1}.mini{color:#6b7e8f;font-size:12px}.summary{display:grid;gap:11px}.summaryitem{border:1px solid #dfe8ed;border-radius:11px;padding:13px 15px}.summaryitem h3{font-size:14px;margin:0 0 5px;color:#126d68}.summaryitem p{margin:0;font-size:14px}.finish{border:1px solid #bbdacf;background:#f3faf7;padding:13px 16px;border-radius:11px;margin-bottom:17px}.finish h2{font-size:22px;margin:0 0 6px}.finish p{margin:0}.footer-note{font-size:12px;color:#63778b;margin-top:11px}@media(max-width:720px){.shell{margin:0 auto;padding:0}.top{border-radius:0;padding:19px}.top h1{font-size:22px}.top .fullscreen{font-size:0;padding:9px}.top .fullscreen:after{content:'⛶';font-size:17px}.main{padding:19px;border-radius:0}.areas{grid-template-columns:1fr}.bin{min-height:90px}.content h2{font-size:20px}.btn{padding:10px 12px}}:fullscreen{background:var(--bg);overflow:auto}:fullscreen .shell{margin-top:8px}
</style>
</head>
<body>
<div class="shell" id="app"><header class="top"><div><div class="eyebrow">Курс «Найдите новые источники мотивации» · Практика</div><h1>Предупредите о последствиях</h1><p>Помогите руководителю назвать реальный риск и предложить действия, которые позволят его избежать.</p></div><button class="fullscreen" id="fullBtn" type="button">⛶ На весь экран</button></header>
<main class="main"><div class="progress" id="progress"></div><section id="content" class="content" aria-live="polite"></section><nav class="actions"><button type="button" class="btn" id="back">← Вернуться назад</button><button type="button" class="btn" id="again">Попробовать снова</button><span class="stretch"></span><span class="mini" id="stepLabel"></span><button type="button" class="btn primary" id="check">Проверить</button><button type="button" class="btn teal" id="next" hidden>Продолжить →</button></nav></main></div>
<script>
(()=>{'use strict';
const problem='В «Контуре» обновляют электронные паспорта оборудования для дилеров. Через десять дней новые карточки должны появиться в каталоге. Сотрудники откладывают заполнение: боятся ошибиться в кодах комплектации. До общего запуска можно проверить четыре карточки вместе с сервисной службой.';
const dragCards=[
{id:'a',text:'Без кодов изделий карточки не загрузятся в каталог.',group:'fact'},
{id:'b',text:'Непроверенная комплектация может попасть в паспорт с ошибкой.',group:'fact'},
{id:'c',text:'Если не поторопитесь, всех лишат премий.',group:'guess'},
{id:'d',text:'Из-за одной ошибки компания обязательно потеряет всех дилеров.',group:'guess'}];
const stages=[
{title:'Отделите риск от запугивания',intro:'Для предупреждения нужны последствия, которые можно объяснить и проверить. Распределите утверждения по двум группам.',type:'drag'},
{title:'Сформулируйте предупреждение',intro:'Сотрудники опасаются ошибок, поэтому откладывают работу. Как руководителю объяснить, почему проверку важно начать сейчас?',type:'single',options:[
'Если карточки не будут готовы, отдел подведёт всю компанию. Потом не жалуйтесь на последствия.',
'Если до среды не проверим первые четыре карточки, можем обнаружить ошибки слишком поздно. Давайте сегодня возьмём образец, а завтра вместе с сервисом сверим коды.',
'Ничего страшного не произойдёт. Главное — не переживайте, как-нибудь заполним.',
'Все уверенные специалисты уже заполнили карточки. Остальным стоит подтянуться.'
],answer:1},
{title:'Снизьте риск для сотрудников',intro:'Выберите все действия, которые действительно помогут начать работу и уменьшить вероятность ошибки.',type:'multi',options:[
'Дать пример правильно заполненного паспорта.',
'Выделить время на проверку четырёх карточек и согласовать помощь специалиста сервиса.',
'Попросить заполнить все паспорта до завтра без дополнительной проверки.',
'Вывесить список тех, кто дольше остальных не начинает работу.'
],answer:[0,1]},
{title:'Отреагируйте на результат проверки',intro:'В четырёх пробных паспортах обнаружилось одно поле с неоднозначным названием. Сотрудники считают, что из-за него ошибки могут повториться. Что сделать дальше?',type:'single',options:[
'Напомнить команде, что времени мало, и потребовать продолжить работу без изменений.',
'Остановить внедрение навсегда: риск оказался слишком высоким.',
'Уточнить название поля с сервисом, исправить образец и повторно проверить несколько карточек до массового заполнения.',
'Сделать замечание сотруднику, который первым заполнил поле неправильно.'
],answer:2}
];
const state={step:0,checked:{},answers:{1:null,2:[],3:null},places:Object.fromEntries(dragCards.map(x=>[x.id,'bank'])),touchId:null,done:false};
const el=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=()=>state.checked[state.step]===true;
function hasAnswer(){if(state.step===0)return dragCards.every(c=>state.places[c.id]!=='bank');if(state.step===2)return state.answers[2].length>0;return state.answers[state.step]!==null}
function isRight(){let i=state.step,s=stages[i];if(i===0)return dragCards.every(c=>state.places[c.id]===c.group);if(i===2)return s.answer.every(x=>state.answers[2].includes(x))&&state.answers[2].length===s.answer.length;return state.answers[i]===s.answer}
function render(){
const i=state.step;el('progress').innerHTML=stages.map((_,j)=>`<i class="${j<i?'done':j===i?'current':''}"></i>`).join('');
if(state.done){el('content').innerHTML=`<div class="finish"><h2>Практика завершена</h2><p>Вы провели команду от разговора о последствиях к действиям, которые помогают избежать риска.</p></div><div class="summary">${[['1. Реальный риск','Назвать конкретное последствие, опираясь на условия задачи, а не на угрозы.'],['2. Понятное предупреждение','Объяснить, что может произойти и почему действовать нужно сейчас.'],['3. Снижение риска','Дать образец, время на проверку и доступ к компетентному коллеге.'],['4. Проверка','Исправить обнаруженную причину ошибки до массового внедрения.']].map(([a,b])=>`<div class="summaryitem"><h3>${a}</h3><p>${b}</p></div>`).join('')}</div>`;el('check').hidden=true;el('next').hidden=true;el('stepLabel').textContent='Итог';el('back').disabled=false;el('again').textContent='Пройти заново';let download=document.createElement('button');download.type='button';download.className='btn teal';download.textContent='Сохранить план';download.id='download';el('next').replaceWith(download);download.onclick=()=>{const val=['Предупреждение о последствиях — итог практики','', '1. Назовите проверяемый риск, без преувеличения и угроз.','2. Объясните, что нужно сделать сейчас и в какой срок.','3. Снизьте риск для исполнителя: образец, консультация, время на пробу.','4. Проверьте пилот и устраните найденные недостатки.','', 'Важно: предупреждение не заменяет решения проблем с нагрузкой, сроками и ресурсами.'].join('\n');const blob=new Blob(['\ufeff',val],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='План_предупреждения_о_последствиях.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};return}
let s=stages[i];let intro=`<h2>${i+1}. ${s.title}</h2><div class="case"><strong>Ситуация в «Контуре».</strong> ${problem}</div><p class="instruction">${s.intro}</p>`;
if(i===0){const chips=group=>dragCards.filter(c=>state.places[c.id]===group).map(c=>`<div draggable="true" tabindex="0" data-id="${c.id}" class="chip ${state.checked[0]===false&&group!=='bank'&&group!==c.group?'invalid':state.checked[0]===true?'valid':''} ${state.touchId===c.id?'selected':''}">${esc(c.text)}${group==='bank'?'':` <button type="button" class="return" data-return="${c.id}" aria-label="Вернуть карточку">↩</button>`}</div>`).join('');el('content').innerHTML=intro+`<div class="areas"><div class="bin" data-bin="fact"><h3>Обоснованное последствие</h3><p>Можно объяснить на основе условий задачи</p><div class="contents">${chips('fact')}</div></div><div class="bin" data-bin="guess"><h3>Запугивание или предположение</h3><p>Не подтверждено ситуацией</p><div class="contents">${chips('guess')}</div></div></div><div class="banktitle">Карточки для распределения</div><div class="bank" data-bin="bank">${chips('bank')}</div><p class="footer-note">Перетащите карточки в подходящую группу. На телефоне можно сначала выбрать карточку, затем нажать на нужную группу.</p>`;bindDrag()}
else{let answers=i===2?state.answers[2]:state.answers[i];el('content').innerHTML=intro+`<div class="choices">${s.options.map((opt,j)=>{let selected=i===2?answers.includes(j):answers===j;let cls=selected?'active':'';if(state.checked[i]===false&&selected)cls+=i===2&&s.answer.includes(j)?'':' invalid';if(state.checked[i]===true&&selected)cls+=' valid';return `<button type="button" class="choice ${cls}" data-choice="${j}" aria-pressed="${selected}"><span class="mark">${i===2?(selected?'✓':'□'):String.fromCharCode(1040+j)}</span><span>${esc(opt)}</span></button>`}).join('')}</div>${i===2?'<p class="footer-note">Можно выбрать несколько действий.</p>':''}`;el('content').querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{let j=Number(b.dataset.choice);if(i===2){let a=state.answers[2];state.answers[2]=a.includes(j)?a.filter(x=>x!==j):[...a,j]}else state.answers[i]=j;delete state.checked[i];render()}))}
if(state.checked[i]!==undefined){const ok=state.checked[i];let msg=ok?['Верно. Вы отличили подтверждённые последствия от давления и догадок.','Верно. Предупреждение конкретно: есть срок, возможное последствие и первый шаг с поддержкой.','Верно. Подготовка и совместная проверка уменьшают риск и помогают приступить к работе.','Верно. Ошибка в пилоте — повод исправить образец, а не обвинять сотрудников.'][i]:['Проверьте, какие утверждения следуют из самой ситуации, а какие предполагают наказание или неизбежную катастрофу.','Попробуйте выбрать формулировку, в которой одновременно есть проверяемое последствие и понятный способ действовать.','Выберите меры, которые помогут сотрудникам выполнить работу без лишнего давления.','Подумайте, какое действие уменьшит вероятность повторения обнаруженной ошибки.'][i];el('content').insertAdjacentHTML('beforeend',`<div class="notice ${ok?'good':'bad'}" role="status">${msg}</div>`)}
el('check').hidden=false;el('check').disabled=active();el('next').hidden=!active();el('next').textContent=i===3?'К итогам →':'Продолжить →';el('back').disabled=i===0;el('again').textContent='Попробовать снова';el('stepLabel').textContent=`Этап ${i+1} из ${stages.length}`}
function place(id,dest){if(state.places[id]===dest)return;state.places[id]=dest;delete state.checked[0];state.touchId=null;render()}
function bindDrag(){document.querySelectorAll('.chip[data-id]').forEach(c=>{c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'});c.addEventListener('click',e=>{if(e.target.closest('.return'))return;state.touchId=state.touchId===c.dataset.id?null:c.dataset.id;render()});c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();state.touchId=c.dataset.id;render()}})});document.querySelectorAll('[data-bin]').forEach(bin=>{bin.addEventListener('dragover',e=>{e.preventDefault();bin.classList.add('over')});bin.addEventListener('dragleave',()=>bin.classList.remove('over'));bin.addEventListener('drop',e=>{e.preventDefault();bin.classList.remove('over');let id=e.dataTransfer.getData('text/plain');if(id in state.places)place(id,bin.dataset.bin)});bin.addEventListener('click',e=>{if(e.target.closest('[data-id]'))return;if(state.touchId)place(state.touchId,bin.dataset.bin)})});document.querySelectorAll('[data-return]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();place(b.dataset.return,'bank')}))}
function reset(){if(state.done){state.done=false;state.step=0;for(let k in state.checked)delete state.checked[k];state.answers={1:null,2:[],3:null};for(let c of dragCards)state.places[c.id]='bank';let d=el('download');if(d){let n=document.createElement('button');n.id='next';n.className='btn teal';n.hidden=true;d.replaceWith(n)};render();return}let i=state.step;delete state.checked[i];if(i===0){for(let c of dragCards)state.places[c.id]='bank'}else state.answers[i]=i===2?[]:null;state.touchId=null;render()}
el('check').onclick=()=>{if(!hasAnswer()){el('content').querySelector('.notice')?.remove();el('content').insertAdjacentHTML('beforeend','<div class="notice bad" role="status">Сначала выполните задание, затем проверьте ответ.</div>');return}state.checked[state.step]=isRight();render()};el('app').addEventListener('click',e=>{if(e.target.id!=='next')return;if(!active())return;if(state.step===stages.length-1)state.done=true;else state.step++;render()});el('back').onclick=()=>{if(state.done){state.done=false;let d=el('download');if(d){let n=document.createElement('button');n.id='next';n.className='btn teal';n.hidden=true;d.replaceWith(n)}}else if(state.step>0)state.step--;render()};el('again').onclick=reset;el('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('app').requestFullscreen?.()};render();
})();
</script>
</body></html>
