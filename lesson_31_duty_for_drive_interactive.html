<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Дежурство по драйву — интерактив</title>
<style>
:root{--bg:#eef3f6;--ink:#203448;--quiet:#65778b;--deep:#142c3d;--teal:#167e88;--soft:#e8f5f5;--line:#dbe5e9;--red:#be4654;--redBg:#fff1f2;--green:#287c65;--greenBg:#eaf8f0;--white:#fff;--shadow:0 13px 35px rgba(20,44,61,.09)}
*{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;margin:0;color:var(--ink);background:var(--bg)}.shell{max-width:1070px;margin:24px auto 36px;padding:0 18px}.hero{background:var(--deep);color:#fff;border-radius:19px 19px 0 0;padding:27px 33px 23px;display:flex;justify-content:space-between;gap:25px;align-items:flex-start}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:#9fd9db;font-weight:750}.hero h1{font-size:clamp(23px,3.5vw,33px);line-height:1.12;margin:8px 0}.hero p{max-width:710px;font-size:14px;line-height:1.55;color:#cfdee4;margin:0}.topbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid #5d7585;border-radius:10px;padding:9px 12px;font-weight:650;white-space:nowrap;cursor:pointer}.panel{background:#fff;padding:25px 32px 29px;border-radius:0 0 19px 19px;box-shadow:var(--shadow);min-height:555px}.stephead{display:flex;justify-content:space-between;gap:16px;align-items:center}.stephead strong{font-size:13px;color:var(--teal)}.dots{display:flex;gap:6px}.dot{height:6px;width:39px;border-radius:20px;background:#e2e8ed}.dot.active{background:var(--teal)}h2{font-size:24px;margin:20px 0 8px;line-height:1.26}.desc{font-size:15px;line-height:1.53;color:#4d5c69;max-width:880px;margin:0 0 20px}.desc strong{color:var(--ink)}.note{background:#f2f8f8;border-left:3px solid #53abb1;border-radius:7px;font-size:13px;padding:11px 14px;margin:0 0 15px;line-height:1.5}.bank,.zone{border:1.5px dashed #bdcdd1;border-radius:14px;padding:13px;min-height:114px;background:#fbfdfd}.bank{margin-bottom:14px}.bank h3,.zone h3{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.01em}.bank h3{color:#667e85}.zone h3{color:#38656a}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-content:start}.card-piece{display:block;padding:12px 13px;line-height:1.4;font-size:13px;min-height:65px;border:1px solid #ccdce0;border-radius:11px;background:white;cursor:grab;user-select:none;touch-action:none;box-shadow:0 2px 4px rgba(0,0,0,.025)}.card-piece:focus-visible{outline:3px solid #65bdc5;outline-offset:2px}.card-piece.dragging{opacity:.38}.card-piece.good{border:2px solid var(--green);background:var(--greenBg)}.card-piece.bad{border:2px solid var(--red);background:var(--redBg)}.dropzones{display:grid;grid-template-columns:1fr 1fr;gap:14px}.zone .cards{grid-template-columns:1fr 1fr}.zone.hover,.bank.hover{background:#e6f7f6;border-color:#22949b}.choicegrid{display:grid;gap:9px}.choice{border:1.5px solid #d6e1e6;background:#fff;border-radius:11px;display:flex;gap:12px;align-items:flex-start;padding:14px 15px;line-height:1.48;font-size:14px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font-family:inherit}.choice:hover{border-color:#72b9bc}.choice:focus-visible{outline:3px solid #65bdc5}.choice .marker{display:grid;place-items:center;flex:0 0 25px;height:25px;border:1.3px solid #9ab1bb;border-radius:50%;font-size:12px;font-weight:800;color:#718998}.choice.selected{border-color:var(--teal);background:#eef8f9}.choice.selected .marker{background:var(--teal);color:white;border-color:var(--teal)}.choice.good{border-color:var(--green);background:var(--greenBg)}.choice.bad{border-color:var(--red);background:var(--redBg)}.choice.multi .marker{border-radius:7px}.scenario{border-left:3px solid #d7ac66;background:#fffbf1;border-radius:6px;padding:13px 15px;margin-bottom:15px;line-height:1.55;font-size:14px}.feedback{margin-top:14px;padding:13px 16px;background:#f0f6f7;border-radius:11px;color:#3b5961;font-size:14px;line-height:1.5}.feedback.success{background:var(--greenBg);color:#24684f}.feedback.error{background:var(--redBg);color:#984350}.footer{border-top:1px solid #e7ecef;margin-top:24px;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{font:inherit;font-size:13px;font-weight:750;cursor:pointer;border:1px solid #cad8dd;border-radius:10px;padding:11px 16px;background:#fff;color:#334b5c}.btn.main{background:var(--teal);border-color:var(--teal);color:white}.btn:disabled{cursor:not-allowed;opacity:.42}.btn:hover:not(:disabled){filter:brightness(.96)}.muted{font-size:12px;color:#738794}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:750}.field input,.field textarea{border:1px solid #cbdae1;border-radius:10px;font:inherit;font-size:14px;font-weight:450;color:var(--ink);padding:12px;line-height:1.5;background:#fff}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus{outline:2px solid #85c7c8;border-color:#85c7c8}.span2{grid-column:1/-1}.pill{display:inline-block;padding:4px 9px;color:#44656a;background:#e9f6f5;border-radius:15px;font-size:12px;font-weight:700}.finish{padding:21px 19px;background:var(--greenBg);border-radius:13px;margin-top:14px;line-height:1.58}.finish h3{margin:0 0 8px}.ghost{position:fixed;z-index:10000;pointer-events:none;transform:translate(-50%,-50%);opacity:.9;width:230px;box-shadow:0 9px 25px rgba(0,0,0,.23)}@media(max-width:700px){.shell{margin:0 auto;padding:0}.hero{border-radius:0;padding:20px 18px;flex-wrap:wrap}.hero h1{font-size:25px}.topbtn{font-size:12px}.panel{border-radius:0;padding:20px 15px}.cards{grid-template-columns:1fr 1fr}.zone .cards{grid-template-columns:1fr}.dropzones,.formgrid{grid-template-columns:1fr}.stephead{align-items:flex-start}.dot{width:25px}.footer{align-items:stretch}.buttons{width:100%}.btn{flex:1}.muted{display:none}}@media(max-width:420px){.cards{grid-template-columns:1fr}.zone .cards{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="hero"><div><div class="eyebrow">Практика для руководителей · Урок 31</div><h1>Дежурство по драйву</h1><p>Помогите команде договориться о небольших добровольных способах поддержки. Пройдите четыре этапа и составьте план для своего подразделения.</p></div><button id="fullscreen" class="topbtn" type="button">⛶ На весь экран</button></header><section class="panel"><div class="stephead"><strong id="stepcount">Этап 1 из 4</strong><div class="dots" id="dots" aria-hidden="true"></div></div><div id="content"></div><div id="feedback" role="status" aria-live="polite"></div><footer class="footer"><span class="muted" id="hint">Задание основано на рабочих ситуациях компании «Контур».</span><div class="buttons"><button id="back" class="btn">Вернуться назад</button><button id="reset" class="btn">Попробовать снова</button><button id="check" class="btn main">Проверить</button><button id="next" class="btn main" hidden>Продолжить</button></div></footer></section></main>
<script>
const state={step:0, checked:false, passed:[false,false,false,false], placement:{},single:null,multi:new Set(),plan:{},finished:false};
const pieces=[
{id:'a',text:'Дежурный предлагает желающим короткую загадку в чате',answer:'support'},
{id:'b',text:'Руководитель назначает дежурных без согласия',answer:'pressure'},
{id:'c',text:'Участник может пропустить день, если не хватает сил',answer:'support'},
{id:'d',text:'Каждый обязан публично рассказать, почему ему грустно',answer:'pressure'},
{id:'e',text:'Коллега предлагает две минуты адресных благодарностей',answer:'support'},
{id:'f',text:'Дежурный отвечает за хорошее настроение всех сотрудников',answer:'pressure'}
];
const single=[
'Обязать всех дежурить по графику независимо от желания',
'Собрать добровольцев, позволить им выбрать формат и оставить коллегам право не участвовать',
'Назначать только самых общительных сотрудников, не спрашивая согласия',
'После дежурства оценивать, кто смог поднять настроение команды'
];
const multi=[
'Уточнить, хочет ли сотрудник вообще участвовать, и принять отказ без последствий',
'Предложить другой небольшой формат поддержки, только если он сам заинтересован',
'Попросить объяснить свою усталость перед всей командой',
'Напомнить, что отказ будет учтён при оценке вовлечённости',
'Обязать сотрудника присоединиться хотя бы на пять минут'
];
const $=s=>document.querySelector(s),e=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function setMsg(msg,kind=''){const f=$('#feedback');f.innerHTML='';if(msg){const el=e('div','feedback '+kind,msg);f.appendChild(el)}}
function setStep(n){state.step=n;state.checked=false;render()}
function render(){
 const st=state.step;$('#stepcount').textContent=`Этап ${st+1} из 4`;
 $('#dots').innerHTML=[0,1,2,3].map(x=>`<span class="dot ${x===st?'active':''}"></span>`).join('');
 const content=$('#content');content.innerHTML='';setMsg('');
 $('#back').disabled=st===0;$('#check').textContent=st===3?'Сохранить план':'Проверить';$('#check').hidden=state.finished && st===3;
 $('#next').hidden=!(state.passed[st] && st<3);$('#next').textContent='Продолжить';
 if(st===0)stageOne(content);if(st===1)stageTwo(content);if(st===2)stageThree(content);if(st===3)stageFour(content);
 if(state.passed[st]&&st<3){setMsg('Этап выполнен. Можно продолжить или пересмотреть ответ.','success')}
 if(st===3&&state.finished)showFinish(content)
}
function intro(root,title,desc){const h=e('h2','',title);root.append(h,e('p','desc',desc))}
function getZone(id){return document.querySelector(`[data-zone="${id}"] .cards`)}
function stageOne(root){intro(root,'Какая поддержка действительно помогает?','Марина предлагает команде «Контура» неделю дежурств по драйву. Перетащите каждую карточку из банка в подходящую колонку. Карточку можно вернуть обратно в банк.');
 const note=e('div','note','Поддерживающее действие оставляет людям выбор. Действие, которое вынуждает демонстрировать радость или раскрывать личное, создаёт давление.');root.appendChild(note);
 const bank=e('section','bank');bank.dataset.zone='bank';bank.append(e('h3','','КАРТОЧКИ'));bank.append(e('div','cards'));root.appendChild(bank);
 const zones=e('div','dropzones');[['support','Поддерживает команду'],['pressure','Создаёт давление']].forEach(([id,label])=>{const z=e('section','zone');z.dataset.zone=id;z.append(e('h3','',label));z.append(e('div','cards'));zones.append(z)});root.append(zones);
 [...document.querySelectorAll('[data-zone]')].forEach(zone=>{
 zone.addEventListener('dragover',ev=>{ev.preventDefault();zone.classList.add('hover')});
 zone.addEventListener('dragleave',ev=>{if(!zone.contains(ev.relatedTarget))zone.classList.remove('hover')});
 zone.addEventListener('drop',ev=>{ev.preventDefault();zone.classList.remove('hover');const id=ev.dataTransfer.getData('text/plain');if(pieces.some(p=>p.id===id))movePiece(id,zone.dataset.zone)});
 });
 pieces.forEach(p=>{const zone=state.placement[p.id]||'bank';const card=e('div','card-piece',p.text);card.dataset.id=p.id;card.tabIndex=0;card.draggable=true;card.setAttribute('role','button');card.setAttribute('aria-label',p.text+'. Перетащите в выбранную категорию');
 card.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',p.id);ev.dataTransfer.effectAllowed='move';card.classList.add('dragging')});card.addEventListener('dragend',()=>card.classList.remove('dragging'));
 card.addEventListener('pointerdown',ev=>{if(ev.pointerType==='touch')touchBegin(ev,p.id,card)});
 card.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();let to=prompt('Куда перенести карточку? 1 — поддерживает, 2 — давление, 0 — обратно в банк');if(to==='1')movePiece(p.id,'support');if(to==='2')movePiece(p.id,'pressure');if(to==='0')movePiece(p.id,'bank')}});
 if(state.checked&&zone!=='bank'){card.classList.add(zone===p.answer?'good':'bad')}
 getZone(zone).appendChild(card)
 });
}
function touchBegin(ev,id,card){const box=card.getBoundingClientRect(),clone=card.cloneNode(true);clone.className='card-piece ghost';clone.style.left=ev.clientX+'px';clone.style.top=ev.clientY+'px';document.body.appendChild(clone);card.classList.add('dragging');card.setPointerCapture(ev.pointerId);
 const moving=event=>{clone.style.left=event.clientX+'px';clone.style.top=event.clientY+'px'};
 const finished=event=>{card.removeEventListener('pointermove',moving);card.removeEventListener('pointerup',finished);card.removeEventListener('pointercancel',finished);clone.remove();card.classList.remove('dragging');const target=document.elementFromPoint(event.clientX,event.clientY);const zone=target?.closest('[data-zone]');if(zone)movePiece(id,zone.dataset.zone)};
 card.addEventListener('pointermove',moving);card.addEventListener('pointerup',finished);card.addEventListener('pointercancel',finished,{once:true});}
function movePiece(id,zone){state.placement[id]=zone;state.checked=false;state.passed[0]=false;stageOneRerender()}
function stageOneRerender(){render()}
function choiceButton(text,i,selected,isMulti){const b=e('button','choice'+(selected?' selected':'')+(isMulti?' multi':''));b.type='button';b.dataset.index=i;const m=e('span','marker',isMulti?selected?'✓':'':String.fromCharCode(1040+i));b.append(m,e('span','',text));return b}
function stageTwo(root){intro(root,'Согласуйте порядок дежурств','Алина и Дмитрий готовы попробовать формат, но часть коллег не любит игровые мероприятия. Как лучше договориться о дежурствах?');const grid=e('div','choicegrid');single.forEach((t,i)=>{const b=choiceButton(t,i,state.single===i,false);b.onclick=()=>{state.single=i;state.passed[1]=false;state.checked=false;render()};if(state.checked&&i===state.single)b.classList.add(i===1?'good':'bad');grid.append(b)});root.append(grid)}
function stageThree(root){intro(root,'Отреагируйте на отказ','Во время обсуждения Олег говорит, что после сложной недели устал и не хочет участвовать в танцевальных паузах. Выберите два уместных действия руководителя.');const scen=e('div','scenario','Олег: «Я не против коллег, но сейчас у меня нет сил ни на какие игры. И танцевать на планёрке я не хочу».');root.append(scen);const grid=e('div','choicegrid');multi.forEach((t,i)=>{const b=choiceButton(t,i,state.multi.has(i),true);b.onclick=()=>{state.multi.has(i)?state.multi.delete(i):state.multi.add(i);state.passed[2]=false;state.checked=false;render()};if(state.checked&&state.multi.has(i))b.classList.add(i<2?'good':'bad');grid.append(b)});root.append(grid)}
function stageFour(root){intro(root,'Подготовьте дежурство для своей команды','Выберите одну небольшую идею для недельного пилота. Достаточно простого плана, который не требует дополнительной нагрузки и оставляет людям свободу участия.');root.append(e('div','pill','Ваш рабочий шаблон'));const grid=e('div','formgrid');const fields=[['goal','Какая потребность команды?','Например: сотрудники редко замечают помощь коллег','textarea'],['idea','Что предложит дежурный?','Например: один короткий вопрос о полезном действии коллеги','textarea'],['free','Как обеспечите добровольность?','Например: участвующие сами выбирают день, отвечать не обязательно','textarea'],['review','Когда и как узнаете впечатления?','Например: через неделю коротко спросим, стоит ли продолжать','textarea']];fields.forEach(([id,label,placeholder,type])=>{const item=e('label','field');item.textContent=label;const input=e(type==='textarea'?'textarea':'input');input.placeholder=placeholder;input.value=state.plan[id]||'';input.setAttribute('aria-label',label);input.addEventListener('input',()=>{state.plan[id]=input.value;state.finished=false;$('#check').hidden=false;setMsg('')});item.append(input);grid.append(item)});root.append(grid);root.append(e('p','desc','Когда план будет готов, нажмите «Сохранить план». Вы получите текстовый файл, который можно использовать при обсуждении с командой.'))}
function textPlan(){return `ДЕЖУРСТВО ПО ДРАЙВУ — МОЙ ПЛАН\n\n1. Потребность команды:\n${state.plan.goal}\n\n2. Небольшая инициатива:\n${state.plan.idea}\n\n3. Добровольность и уважение к границам:\n${state.plan.free}\n\n4. Проверка через неделю:\n${state.plan.review}\n\nВажное условие: поддержка — не обязанность быть весёлым. Мы можем завершить практику, если она не помогает.\n`}
function downloadPlan(){const blob=new Blob([textPlan()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=e('a');link.href=url;link.download='plan_dezhurstvo_po_drayvu.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function showFinish(root){if(root.querySelector('.finish'))return;const f=e('div','finish');f.append(e('h3','','План сохранён'),e('p','','У вас есть первый вариант дежурства. Предложите его коллегам для обсуждения — окончательный формат команда должна выбрать вместе.'));const btn=e('button','btn main','Скачать план ещё раз');btn.addEventListener('click',downloadPlan);f.append(btn);root.append(f)}
function check(){const st=state.step;if(st===0){if(pieces.some(p=>!state.placement[p.id]||state.placement[p.id]==='bank')){setMsg('Распределите все шесть карточек по двум колонкам.','error');return}state.checked=true;let ok=pieces.every(p=>state.placement[p.id]===p.answer);state.passed[0]=ok;render();setMsg(ok?'Верно. Уместная поддержка оставляет сотрудникам свободу выбора.':'Некоторые карточки распределены неверно. Перетащите выделенные красным карточки в другую колонку и нажмите «Проверить» ещё раз.',ok?'success':'error');return}
 if(st===1){if(state.single===null){setMsg('Выберите один вариант.','error');return}state.checked=true;const ok=state.single===1;state.passed[1]=ok;render();setMsg(ok?'Верно. Люди сами выбирают участие и подходящий способ поддержки.':'В этом варианте недостаточно свободы выбора. Попробуйте другой ответ.',ok?'success':'error');return}
 if(st===2){if(state.multi.size===0){setMsg('Выберите два действия.','error');return}state.checked=true;const ok=state.multi.size===2&&state.multi.has(0)&&state.multi.has(1);state.passed[2]=ok;render();setMsg(ok?'Верно. Отказ не означает нелояльность, а забота не должна нарушать личные границы.':'Проверьте выбор: поддержка не требует объяснять усталость или участвовать против желания.',ok?'success':'error');return}
 if(st===3){if(Object.values(state.plan).filter(v=>v&&v.trim().length>=8).length<4){setMsg('Заполните все четыре поля. В каждом достаточно одного конкретного предложения.','error');return}state.finished=true;state.passed[3]=true;render();setMsg('Ваш план готов. Файл сохранён; его также можно скачать повторно кнопкой ниже.','success');downloadPlan()}}
$('#check').addEventListener('click',check);$('#back').addEventListener('click',()=>{if(state.step>0)setStep(state.step-1)});$('#next').addEventListener('click',()=>{if(state.step<3&&state.passed[state.step])setStep(state.step+1)});$('#reset').addEventListener('click',()=>{const st=state.step;if(st===0)state.placement={};else if(st===1)state.single=null;else if(st===2)state.multi=new Set();else{state.plan={};state.finished=false}state.passed[st]=false;state.checked=false;render()});$('#fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}});
render();
</script></body></html>
